version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ostia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ostia
      POSTGRES_USER: ostia_user
      POSTGRES_PASSWORD: ostia_secret
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ostia_user -d ostia']
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    build: ./core
    container_name: ostia_core
    restart: unless-stopped
    env_file: ./core/.env
    ports:
      - '8001:8001'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
