<div class="auth-container">
  <nz-card class="auth-card">
    <div class="auth-header">
      <img src="/favicon.ico" alt="OstIA" class="brand-logo" />
      <p>Réinitialiser le mot de passe</p>
    </div>
    @if (invalidLink) {
      <p style="color: rgba(255,255,255,.6); text-align: center;">Lien de réinitialisation invalide.</p>
    } @else {
      <form nz-form [formGroup]="form" (ngSubmit)="onSubmit()">
        <nz-form-item>
          <nz-form-control nzErrorTip="Mot de passe requis (min. 8 caractères)">
            <input nz-input formControlName="password" placeholder="Nouveau mot de passe" type="password" />
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-control [nzErrorTip]="confirmPasswordErrorTip">
            <input
              nz-input
              formControlName="confirmPassword"
              placeholder="Confirmer le mot de passe"
              type="password"
            />
            <ng-template #confirmPasswordErrorTip let-control>
              {{ control.hasError('passwordMismatch') ? 'Les mots de passe ne correspondent pas' : 'Requis' }}
            </ng-template>
          </nz-form-control>
        </nz-form-item>
        <button nz-button nzType="primary" nzBlock [nzLoading]="loading" type="submit">
          Réinitialiser le mot de passe
        </button>
      </form>
    }
    <div class="auth-footer">
      <a routerLink="/auth/login">Retour à la connexion</a>
    </div>
  </nz-card>
</div>
