<div class="auth-container">
  <nz-card class="auth-card">
    <div class="auth-header">
      <img src="/favicon.ico" alt="OstIA" class="brand-logo" />
      <p>Mot de passe oublié</p>
    </div>
    @if (!submitted) {
      <form nz-form [formGroup]="form" (ngSubmit)="onSubmit()">
        <nz-form-item>
          <nz-form-control nzErrorTip="Email invalide">
            <input nz-input formControlName="email" placeholder="Email" type="email" />
          </nz-form-control>
        </nz-form-item>
        <button nz-button nzType="primary" nzBlock [nzLoading]="loading" type="submit">
          Envoyer le lien de réinitialisation
        </button>
      </form>
    } @else {
      <p style="color: rgba(255,255,255,.6); text-align: center;">
        Si un compte existe pour cet email, un lien de réinitialisation vient de vous être envoyé.
      </p>
    }
    <div class="auth-footer">
      <a routerLink="/auth/login">Retour à la connexion</a>
    </div>
  </nz-card>
</div>
