<div class="page-header">
  <h2 class="page-title">Dashboard</h2>
  <button nz-button nzType="default" [nzLoading]="exportingData()" (click)="exportMyData()">
    <span nz-icon nzType="download"></span>
    Exporter mes données
  </button>
</div>

@if (loading()) {
  <div class="loading-center"><nz-spin nzSize="large"></nz-spin></div>
} @else {
  <div nz-row [nzGutter]="[16, 16]" class="stats-row">
    <div nz-col [nzXs]="12" [nzSm]="6">
      <nz-card class="stat-card">
        <nz-statistic
          nzTitle="Total candidatures"
          [nzValue]="stats()?.total ?? 0"
          [nzValueStyle]="{ color: '#fff', fontWeight: '800' }"
        ></nz-statistic>
      </nz-card>
    </div>
    <div nz-col [nzXs]="12" [nzSm]="6">
      <nz-card class="stat-card">
        <nz-statistic
          nzTitle="Taux de réponse"
          [nzValue]="stats()?.responseRate ?? 0"
          nzSuffix="%"
          [nzValueStyle]="{ color: '#fff', fontWeight: '800' }"
        ></nz-statistic>
      </nz-card>
    </div>
    <div nz-col [nzXs]="12" [nzSm]="6">
      <nz-card class="stat-card">
        <nz-statistic
          nzTitle="Entretiens"
          [nzValue]="stats()?.byStatus?.['INTERVIEW'] ?? 0"
          [nzValueStyle]="{ color: '#fff', fontWeight: '800' }"
        ></nz-statistic>
      </nz-card>
    </div>
    <div nz-col [nzXs]="12" [nzSm]="6">
      <nz-card class="stat-card">
        <nz-statistic
          nzTitle="Offres reçues"
          [nzValue]="stats()?.byStatus?.['OFFER'] ?? 0"
          [nzValueStyle]="{ color: '#fff', fontWeight: '800' }"
        ></nz-statistic>
      </nz-card>
    </div>
  </div>

  <div nz-row [nzGutter]="[16, 16]">
    <div nz-col [nzXs]="24" [nzLg]="8">
      <nz-card nzTitle="Répartition par statut">
        <div echarts [options]="pieOptions()" class="chart"></div>
      </nz-card>
    </div>
    <div nz-col [nzXs]="24" [nzLg]="8">
      <nz-card nzTitle="Activité (30 derniers jours)">
        <div echarts [options]="barOptions()" class="chart"></div>
      </nz-card>
    </div>
    <div nz-col [nzXs]="24" [nzLg]="8">
      <nz-card nzTitle="Pipeline de conversion">
        <div echarts [options]="funnelOptions()" class="chart"></div>
      </nz-card>
    </div>

    @if (topJobs().length > 0) {
      <div nz-col [nzXs]="24">
        <nz-card class="top-jobs-card">
          <div class="top-jobs-header">
            <span class="top-jobs-title">Top offres matchées</span>
            <button nz-button nzType="link" nzSize="small" routerLink="/jobs">
              Rechercher des offres <span nz-icon nzType="arrow-right"></span>
            </button>
          </div>
          <div class="top-jobs-list">
            @for (job of topJobs(); track job.id) {
              <div class="top-job-item">
                <div class="top-job-info">
                  <div class="top-job-title">{{ job.title }}</div>
                  <div class="top-job-company">{{ job.company }}</div>
                  @if (job.matchDetails?.matchedSkills?.length) {
                    <div class="top-job-skills">{{ job.matchDetails!.matchedSkills.slice(0, 3).join(' · ') }}</div>
                  }
                </div>
                <div class="top-job-score">
                  <nz-progress
                    [nzPercent]="job.matchScore ?? 0"
                    nzType="circle"
                    [nzWidth]="44"
                    [nzStrokeColor]="getScoreColor(job.matchScore ?? 0)"
                    [nzFormat]="scoreFormat"
                  ></nz-progress>
                </div>
              </div>
            }
          </div>
        </nz-card>
      </div>
    }
  </div>
}
